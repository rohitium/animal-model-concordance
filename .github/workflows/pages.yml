name: Deploy site to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'site/**'
      - 'data/v04/**'
      - 'analysis/v04/**'
      - 'docs/limitations.md'
      # the workflow must watch itself: a commit fixing only this file matched no
      # path and so deployed nothing, leaving a stale build served for 20 minutes
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      # The v0.4 site is regenerated from the committed v0.4 outputs so the published
      # build always matches the committed data. No network access, no model calls.
      # The v0.3 site (analysis/33_build_site.py, data/db/) is retired; see archive/README.md.
      - name: Build site
        run: python3 analysis/v04/s1_build_site.py
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site/v04_build
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
